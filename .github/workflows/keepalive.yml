# Keeps the free Render demo awake so judges do not wait ~30 s for a cold start.
# Pings the public demo every 10 minutes (GitHub may delay scheduled runs).
name: keep-demo-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 90 https://agecare-1.onrender.com/agent || true
